name: Build GameHub APK

on:
  push:
    branches: [ main ]
    # Faqat ilova kodi o'zgarganda APK yig'iladi (sayt o'zgarishi uchun emas)
    paths:
      - 'lib/**'
      - 'android/**'
      - 'pubspec.yaml'
      - 'pubspec.lock'
      - '.github/workflows/build-apk.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Kodni yuklab olish
        uses: actions/checkout@v4

      - name: Java 17 o'rnatish
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Flutter o'rnatish
        uses: subosito/flutter-action@v2
        with:
          channel: 'stable'

      - name: Kutubxonalarni yuklash
        run: flutter pub get

      - name: Proguard moslashtirish (flutter_inappwebview_android)
        run: sed -i "s/getDefaultProguardFile('proguard-android.txt')/getDefaultProguardFile('proguard-android-optimize.txt')/g" /home/runner/.pub-cache/hosted/pub.dev/flutter_inappwebview_android-*/android/build.gradle

      - name: APK yig'ish (Release)
        run: flutter build apk --release

      - name: Tayyor APK ni saqlash
        uses: actions/upload-artifact@v4
        with:
          name: GameHub-release-apk
          path: build/app/outputs/flutter-apk/app-release.apk

      - name: GitHub Releases ga joylash
        uses: softprops/action-gh-release@v2
        with:
          tag_name: latest-apk
          name: TopGameHub Latest APK
          body: "Avtomatik yig'ilgan eng so'nggi TopGameHub APK versiyasi."
          files: build/app/outputs/flutter-apk/app-release.apk
          make_latest: true
